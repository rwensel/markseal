name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Create environment
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[build]"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Fetch PII model
        run: .venv\Scripts\python.exe packaging\fetch_ner_model.py
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: Markseal-Setup
          path: dist\Markseal-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Create environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[build]"
      - name: Fetch PII model
        run: .venv/bin/python packaging/fetch_ner_model.py
      - name: Build
        env:
          SKIP_TESTS: '1'
        run: sh packaging/build-linux.sh
      - name: Archive
        run: tar -czf Markseal-linux-x64.tar.gz -C dist Markseal
      - uses: actions/upload-artifact@v4
        with:
          name: Markseal-linux-x64
          path: Markseal-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Create environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[build]"
      - name: Fetch PII model
        run: .venv/bin/python packaging/fetch_ner_model.py
      - name: Build
        env:
          SKIP_TESTS: '1'
        run: sh packaging/build-macos.sh
      - name: Archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/Markseal.app Markseal-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Markseal-macos-arm64
          path: Markseal-macos-arm64.zip
          if-no-files-found: error
