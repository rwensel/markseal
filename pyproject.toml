[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markseal"
description = "Private, review-first redaction for screenshots and PDFs with local OCR, a bundled PII model, and pixel-accurate PNG export."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Richard Wensel"}]
keywords = ["redaction", "screenshots", "privacy", "offline", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "Pillow==13.0.0",
    "pypdfium2==5.15.2",
    "opencv-python-headless==5.1.0.95",
    "numpy==2.2.6",
    "PySide6==6.9.3",
    "rapidocr==3.10.0",
    "onnxruntime==1.23.2",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22",
]

[project.gui-scripts]
markseal = "markseal.app:main"

[project.scripts]
markseal-audit = "markseal.audit_exports:main"
markseal-logs = "markseal.performance_log:main"

[project.urls]
Homepage = "https://github.com/rwensel/markseal"
Repository = "https://github.com/rwensel/markseal"
Issues = "https://github.com/rwensel/markseal/issues"

[tool.setuptools.dynamic]
version = {attr = "markseal.__version__"}

[tool.setuptools.packages.find]
include = ["markseal*"]

[tool.setuptools.package-data]
markseal = ["qml/*", "assets/*", "qml/assets/*", "models/*", "models/ner/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
