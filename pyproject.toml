[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markseal"
description = "Local, offline screenshot redaction with a PySide6/Qt Quick interface."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MarkSeal contributors"}]
keywords = ["redaction", "screenshots", "privacy", "offline", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "Pillow==12.3.0",
    "opencv-python-headless==5.1.0.95",
    "numpy==2.2.6",
    "PySide6==6.9.3",
    "rapidocr==3.10.0",
    "onnxruntime==1.23.2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22",
]

[project.gui-scripts]
markseal = "markseal.app:main"

[project.scripts]
markseal-audit = "markseal.audit_exports:main"
markseal-logs = "markseal.performance_log:main"

[tool.setuptools.dynamic]
version = {attr = "markseal.__version__"}

[tool.setuptools.packages.find]
include = ["markseal*"]

[tool.setuptools.package-data]
markseal = ["qml/*", "assets/*", "qml/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
