[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markseal"
description = "Local, offline screenshot redaction with a PySide6/Qt Quick interface."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Pillow==12.3.0",
    "opencv-python-headless==5.1.0.95",
    "numpy==2.2.6",
    "PySide6==6.9.3",
    "rapidocr==3.10.0",
    "onnxruntime==1.23.2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22",
]
release = [
    "boto3>=1.34",
]

[project.gui-scripts]
markseal = "markseal.app:main"

[project.scripts]
markseal-audit = "markseal.audit_exports:main"
markseal-logs = "markseal.performance_log:main"

[tool.setuptools.dynamic]
version = {attr = "markseal.__version__"}

[tool.setuptools.packages.find]
include = ["markseal*"]

[tool.setuptools.package-data]
markseal = ["qml/*", "assets/*", "qml/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
