[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-screenshot-redactor"
description = "Local, offline screenshot redaction with a PySide6/Qt Quick interface."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Pillow==12.3.0",
    "opencv-python-headless==5.1.0.95",
    "numpy==2.2.6",
    "PySide6==6.9.3",
]

[project.optional-dependencies]
rapidocr = [
    "rapidocr==3.10.0",
    "onnxruntime==1.23.2",
]

[project.gui-scripts]
redactor = "redactor.app:main"

[project.scripts]
redactor-audit = "redactor.audit_exports:main"
redactor-logs = "redactor.performance_log:main"

[tool.setuptools.dynamic]
version = {attr = "redactor.__version__"}

[tool.setuptools.packages.find]
include = ["redactor*"]

[tool.setuptools.package-data]
redactor = ["qml/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
